<!DOCTYPE html>
<html>
<head>
    <title>AI Tic-Tac-Toe Pro</title>
    <style>
        :root { --primary: #00d2ff; --glass: rgba(255, 255, 255, 0.1); }
        body { 
            background: linear-gradient(45deg, #0f0c29, #302b63, #24243e);
            color: white; font-family: 'Segoe UI', sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;
        }
        .main-container {
            display: flex; gap: 30px; background: var(--glass);
            backdrop-filter: blur(15px); padding: 40px; border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .grid { display: grid; grid-template-columns: repeat(3, 100px); gap: 15px; margin: 20px 0; }
        
        /* CLICK ANIMATION */
        .cell {
            width: 100px; height: 100px; background: rgba(255,255,255,0.05);
            border-radius: 15px; display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .cell:active { transform: scale(0.9); } /* Shrink on click */
        .cell.x, .cell.o { animation: appear 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        @keyframes appear {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .cell.x { color: #ff4b2b; }
        .cell.o { color: var(--primary); }
        .sidebar { width: 250px; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 20px; }
        .stat-box { margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .highlight { color: var(--primary); font-weight: bold; display: block; margin-top: 5px; }
        select, button { width: 100%; padding: 10px; border-radius: 10px; border: none; cursor: pointer; }
        button { background: var(--primary); color: white; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="game-area">
            <h2 id="status">Your Turn (X)</h2>
            <div class="grid">
                <div class="cell" data-row="0" data-col="0"></div>
                <div class="cell" data-row="0" data-col="1"></div>
                <div class="cell" data-row="0" data-col="2"></div>
                <div class="cell" data-row="1" data-col="0"></div>
                <div class="cell" data-row="1" data-col="1"></div>
                <div class="cell" data-row="1" data-col="2"></div>
                <div class="cell" data-row="2" data-col="0"></div>
                <div class="cell" data-row="2" data-col="1"></div>
                <div class="cell" data-row="2" data-col="2"></div>
            </div>
            <button onclick="resetGame()">Restart Match</button>
        </div>

        <div class="sidebar">
            <div class="stat-box">
                <label>DIFFICULTY:</label>
                <select id="difficulty-select">
                    <option value="Hard">Hard (Minimax)</option>
                    <option value="Medium">Medium (BFS/DFS)</option>
                    <option value="Easy">Easy (Random)</option>
                </select>
            </div>
            <div class="stat-box">
                <div>CURRENT ALGO:</div>
                <span id="algo-display" class="highlight">Waiting...</span>
            </div>
            <div class="stat-box">
                <div>REGRESSION WIN PROB:</div>
                <span id="predict-display" class="highlight">N/A</span>
            </div>
            <div class="stat-box">
                <div>HISTORY (CSV):</div>
                <div id="history-list" style="font-size: 0.8rem; height: 80px; overflow-y: auto;"></div>
            </div>
            <div style="text-align: center; font-size: 1.1rem;">
                PLAYER: <span id="p-score">0</span> | AI: <span id="a-score">0</span>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
